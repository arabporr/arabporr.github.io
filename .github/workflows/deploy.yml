name: Check and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check content and assets
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Keep the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio
          path: dist
          include-hidden-files: true
      - name: Deploy to the existing GitHub Pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
